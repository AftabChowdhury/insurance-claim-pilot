[project]
name = "claimpilot"
version = "0.1.0"
description = "Multi-agent insurance claims copilot: advanced RAG, hybrid search, semantic ranking, guardrails, human-in-the-loop, MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # Agents
    "langgraph>=0.6",
    "langgraph-checkpoint-sqlite>=2.0",
    "aiosqlite>=0.20",
    "langchain-core>=0.3",
    "langchain-openai>=0.3",
    "openai>=1.50",
    "langsmith>=0.1",
    # Retrieval
    "azure-search-documents>=11.5",
    # MCP
    "mcp>=2.3,<3",
    # Documents
    "pymupdf4llm>=0.0.17",
    "python-docx>=1.1",
    # UI
    "streamlit>=1.40",
    "requests>=2.32",
]

[project.optional-dependencies]
# PII masking with Presidio. Without it, a regex fallback is used.
# After installing: uv run python -m spacy download en_core_web_sm
pii = [
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
]

[tool.uv]
package = false
